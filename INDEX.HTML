<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b14;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  text-align: center;
  background: #101525;
  border-bottom: 1px solid #26304a;
}

header h1 {
  margin: 0;
  color: #63e6ff;
  text-shadow: 0 0 15px #00bfff;
}

header p {
  margin: 7px 0 0;
  color: #aab4cc;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.message {
  padding: 12px 15px;
  margin-bottom: 12px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.bot {
  background: #151e32;
  border: 1px solid #263b59;
  align-self: flex-start;
}

.user {
  background: #075985;
  margin-left: auto;
}

#chat {
  display: flex;
  flex-direction: column;
}

form {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #101525;
  border-top: 1px solid #26304a;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #34415e;
  background: #080b14;
  color: white;
  outline: none;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 12px;
  background: #00bfff;
  color: #07111b;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 8px;
  color: #78859e;
  font-size: 11px;
}
</style>
</head>

<body>

<header>
  <h1>✦ NEXORA AI</h1>
  <p>Your personal AI assistant</p>
</header>

<div id="chat">
  <div class="message bot">
    Hey! 👋 Welcome to NEXORA AI.<br>
    I'm ready to chat with you. What would you like to ask?
  </div>
</div>

<form id="chatForm">
  <input id="userInput"
    type="text"
    placeholder="Message NEXORA AI..."
    autocomplete="off"
    required>

  <button type="submit">Send</button>
</form>

<footer>
  NEXORA AI • Your AI journey starts here
</footer>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const chat = document.getElementById("chat");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  const message = document.createElement("div");
  message.className = "message user";
  message.textContent = text;

  chat.appendChild(message);
  input.value = "";

  const reply = document.createElement("div");
  reply.className = "message bot";
  reply.textContent =
    "Your message was received! AI connection is not set up yet. We'll connect an AI model in the next step.";

  chat.appendChild(reply);
  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
